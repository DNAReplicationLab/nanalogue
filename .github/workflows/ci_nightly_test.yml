name: Cargo Build For docs.rs trial

on:
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 6am UTC
  workflow_dispatch:  # Allow manual trigger

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.toolchain }}
      cancel-in-progress: true
    name: Rust project - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - nightly
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup rustup
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup update "$TOOLCHAIN" && rustup default "$TOOLCHAIN"
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.15.0'
      - name: Check repository text hygiene
        run: |
          node github_workflow_scripts/check-strange-characters.ts
          node github_workflow_scripts/check-committed-secrets.ts
      - name: Build
        run: cargo build
