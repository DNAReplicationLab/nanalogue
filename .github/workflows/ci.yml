name: Cargo Build & Test

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  workflow_call:  # Allow calling from release.yml

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    concurrency:
      group: ci-${{ github.ref }}-${{ matrix.toolchain }}
      cancel-in-progress: true
    name: Rust project - latest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup rustup
        env:
          TOOLCHAIN: ${{ matrix.toolchain }}
        run: rustup update "$TOOLCHAIN" && rustup default "$TOOLCHAIN"
      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: '24.15.0'
      - name: Check repository text hygiene
        run: |
          node github_workflow_scripts/check-strange-characters.ts
          node github_workflow_scripts/check-committed-secrets.ts
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      - name: Test remote URL access
        run: cargo test -- --ignored --test-threads=1 peek_remote_zenodo_hela
      - name: Install Zig for libghostty-vt
        run: |
          mkdir -p "$HOME/.local/zig"
          curl -fsSL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz \
            | tar -xJ --strip-components=1 -C "$HOME/.local/zig"
          echo "$HOME/.local/zig" >> "$GITHUB_PATH"
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Cargo clean
        run: cargo clean

  dependency_security:
    concurrency:
      group: ci-${{ github.ref }}-security
      cancel-in-progress: true
    name: Dependency security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Setup rustup
        run: rustup update stable && rustup default stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: Run cargo audit
        run: cargo audit
      - name: Run cargo deny checks
        run: cargo deny check advisories bans sources
