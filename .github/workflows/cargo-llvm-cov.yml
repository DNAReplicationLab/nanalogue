name: Region coverage > 88%

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Coverage
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install nightly Rust
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
      - name: Aggressive cleanup
        run: |
          # Remove unnecessary tools to increase available disk space
          # Remove Java (JDKs)
          sudo rm -rf /usr/lib/jvm

          # Remove .NET SDKs
          sudo rm -rf /usr/share/dotnet

          # Remove Swift toolchain
          sudo rm -rf /usr/share/swift

          # Remove Android SDKs
          sudo rm -rf /usr/local/lib/android

          # print available disk space
          df -h
      - name: Install Zig for libghostty-vt
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q minisign
          sha256sum --check --strict github_workflow_scripts/install-zig-for-libghostty.sha256
          ./github_workflow_scripts/install-zig-for-libghostty.sh
          echo "$HOME/.local/zig-0.15.2" >> "$GITHUB_PATH"
      - name: Generate code coverage
        id: llvm_cov_run
        run: |
          cargo +nightly install cargo-llvm-cov --locked
          REF_PATH=/path/that/does/not/exist cargo +nightly llvm-cov \
            --all-features \
            --workspace \
            --branch \
            --json \
            --summary-only \
            --output-path ./output.json

          functions=$(jq -r '.data[0].totals.functions.percent' ./output.json)
          lines=$(jq -r '.data[0].totals.lines.percent' ./output.json)
          regions=$(jq -r '.data[0].totals.regions.percent' ./output.json)
          branches=$(jq -r '.data[0].totals.branches.percent' ./output.json)

          printf 'function coverage: %.2f%%\n' "$functions"
          printf 'line coverage: %.2f%%\n' "$lines"
          printf 'region coverage: %.2f%%\n' "$regions"
          printf 'branch coverage: %.2f%%\n' "$branches"

          {
            echo '### Nightly production-code coverage'
            echo
            echo '| Metric | Coverage |'
            echo '| --- | ---: |'
            printf '| Functions | %.2f%% |\n' "$functions"
            printf '| Lines | %.2f%% |\n' "$lines"
            printf '| Regions | %.2f%% |\n' "$regions"
            printf '| Branches | %.2f%% |\n' "$branches"
          } >> "$GITHUB_STEP_SUMMARY"

          if ! jq -e '.data[0].totals.regions.percent > 88' ./output.json >/dev/null; then
            echo "::error::Region coverage ($regions%) must be greater than 88%"
            exit 1;
          fi

          rm ./output.json
